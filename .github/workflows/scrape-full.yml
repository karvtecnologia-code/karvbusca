name: Busca completa

on:
  schedule:
    # 07:00, 12:00 e 18:00 em Brasília (UTC-3)
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites separados por vírgula (vazio = todos)"
        required: false
        default: ""

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Navegador do Playwright
        run: pnpm --filter @karv/scraper exec playwright install --with-deps chromium

      - name: Rodar robô
        working-directory: packages/scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # a Loop barra IP de datacenter: roda no PC (scripts/agendar-loop.ps1)
          KARV_SITES_EXCLUIR: loop
        run: pnpm start --modo=completo ${{ inputs.sites && format('--sites={0}', inputs.sites) || '' }}

      - name: Guardar screenshots de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erros-${{ github.run_id }}
          path: packages/scraper/artifacts/
          if-no-files-found: ignore
          retention-days: 14
